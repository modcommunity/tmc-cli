[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmc-cli"
version = "1.1.0"
description = "Command-line client for TMC's public content API (bearer + Ed25519 JWT auth)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["tmc", "api", "cli", "content", "mods"]

# Deliberately empty. The whole tool runs on the standard library so it can be
# dropped onto a build machine or a game server without a package index.
dependencies = []

[project.optional-dependencies]
# Faster Ed25519 signing. The pure-Python fallback in `tmc_cli/ed25519.py`
# produces identical signatures, so this is a performance choice, not a
# functional one.
fast = ["cryptography>=42"]

[project.scripts]
tmc = "tmc_cli.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tmc_cli*"]
